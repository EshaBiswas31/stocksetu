<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin - StockSetu</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="topbar">
    <div class="brand"><span class="mark"></span>StockSetu</div>
    <div class="top-actions">
      <span class="who">Hi, <b id="userName">...</b></span>
      <a href="dashboard.html" class="pill-link">Back to Dashboard</a>
      <button class="pill-link" id="logoutBtn">Log out</button>
    </div>
  </div>

  <div class="page">
    <h2 style="margin-bottom: 18px;">Admin Panel</h2>

    <div class="admin-grid">
      <div class="card">
        <h3>Add Customer</h3>
        <div id="addMsg" class="msg hidden"></div>
        <form id="addCustomerForm">
          <div class="field"><label>Full name</label><input type="text" id="newName" placeholder="Customer's name" required /></div>
          <div class="field"><label>Email</label><input type="email" id="newEmail" placeholder="customer@example.com" required /></div>
          <div class="field"><label>Password</label><input type="text" id="newPassword" placeholder="At least 6 characters" required /></div>
          <div class="field">
            <label>Role</label>
            <select id="newRole">
              <option value="user">Customer</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <button type="submit" class="btn btn-accent btn-wide" id="addBtn">Create Account</button>
        </form>
      </div>

      <div class="card table-card">
        <h3>Admins &amp; Customers</h3>
        <table>
          <thead>
            <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Joined</th><th>Actions</th></tr>
          </thead>
          <tbody id="usersTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="admin.js"></script>
</body>
</html>
